<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邻练体育 - 跳转中</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            text-align: center;
        }
        .container {
            padding: 40px;
            max-width: 400px;
        }
        .logo {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: #11998e;
            font-weight: bold;
        }
        h1 { font-size: 28px; margin-bottom: 10px; }
        h2 { font-size: 20px; margin-bottom: 30px; font-weight: normal; }
        .loading {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            margin: 30px auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p { font-size: 16px; opacity: 0.9; margin-top: 20px; }
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: white;
            color: #11998e;
            text-decoration: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">邻</div>
        <h1>邻练体育</h1>
        <h2>正在跳转...</h2>
        <div class="loading"></div>
        <p>即将为您打开服务页面</p>
        <a href="#" id="manualBtn" class="btn">点击进入</a>
    </div>
    
    <script>
        // 获取目标URL参数
        var targetUrl = window.location.search.match(/to=([^&]+)/);
        targetUrl = targetUrl ? decodeURIComponent(targetUrl[1]) : null;
        
        if (targetUrl) {
            // 自动跳转
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 1000);
            // 手动跳转按钮
            document.getElementById('manualBtn').href = targetUrl;
        } else {
            document.querySelector('h2').textContent = '链接无效';
            document.getElementById('manualBtn').style.display = 'none';
        }
    </script>
</body>
</html>
